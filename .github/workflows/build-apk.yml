name: Build Android APK (Catatan by Iswandi)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./Catatan-by-Iswandi.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Catatan-by-Iswandi-APK
          path: ./Catatan-by-Iswandi.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK (Direct Download for Phone)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Catatan by Iswandi APK v1.0.${{ github.run_number }}
          body: |
            ### 📱 File APK Catatan by Iswandi Siap Pasang
            - **Versi**: 1.0.${{ github.run_number }}
            - **Status**: Berhasil dikompilasi secara otomatis via GitHub Actions
            - **Cara Pasang di HP Android**:
              1. Unduh file `Catatan-by-Iswandi.apk` di bawah ini.
              2. Buka berkas yang telah diunduh di HP Anda.
              3. Izinkan pemasangan aplikasi jika diminta oleh browser/pengelola berkas HP.
              4. Aplikasi Catatan by Iswandi langsung terpasang dan siap digunakan!
          files: ./Catatan-by-Iswandi.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

