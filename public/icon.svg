<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#141c2e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4" />
  
  <!-- Emblem Fish + Book -->
  <g transform="translate(256, 240) scale(1.15)">
    <!-- Book silhouette base -->
    <path d="M -110 50 Q -50 40 0 55 Q 50 40 110 50 L 100 80 Q 50 70 0 85 Q -50 70 -100 80 Z" fill="#F59E0B" opacity="0.3"/>
    
    <!-- Stylized Fish Shape leaping upwards -->
    <path d="M 0 -105 C 45 -70 85 -20 85 45 C 85 75 60 95 30 90 C 15 88 0 78 0 78 C 0 78 -15 88 -30 90 C -60 95 -85 75 -85 45 C -85 -20 -45 -70 0 -105 Z" fill="url(#goldGrad)" filter="url(#goldGlow)"/>
    
    <!-- Tail Fin -->
    <path d="M 0 78 L 45 130 C 20 122 0 115 -15 118 L 0 78 Z" fill="#D97706" />
    <path d="M 0 78 L -45 130 C -20 122 0 115 15 118 L 0 78 Z" fill="#B45309" />
    
    <!-- Fish Gills & Details in dark relief -->
    <path d="M -25 -10 C -15 15 -15 45 -25 60" stroke="#0a0e17" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M 0 -25 C 10 5 10 35 0 55" stroke="#0a0e17" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Fish Eye -->
    <circle cx="0" cy="-60" r="8" fill="#0a0e17"/>
    <circle cx="2" cy="-62" r="3" fill="#FFF"/>
  </g>
  
  <!-- App text inside icon -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="4" fill="#FCD34D" text-anchor="middle">CATATAN ISWANDI</text>
</svg>
